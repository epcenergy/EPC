<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2c3e50">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="EPC">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>EPC Ηλεκτρολόγος</title>
<style>
:root{--ink:#1d2b38;--navy:#2c3e50;--blue:#3498db;--bg:#eef1f4;--card:#fff;--line:#d5dbe1;--red:#c53030;--ok:#28a745}
*{box-sizing:border-box;margin:0;padding:0}
body{font:16px/1.4 -apple-system,Arial,sans-serif;background:var(--bg);color:var(--ink)}
#m{padding:14px 14px calc(150px + env(safe-area-inset-bottom))}
h2{font-size:22px;margin:6px 0 12px;color:var(--navy)}h3{font-size:16px;margin:16px 0 6px;color:var(--navy)}
label{display:block;font-size:13px;font-weight:600;margin:10px 0 3px;color:#456}
input,select,textarea{width:100%;padding:12px;border:1px solid var(--line);border-radius:8px;font:inherit;background:#fff}
textarea{resize:vertical}
button{font:inherit;border:0;border-radius:10px;padding:13px 16px;background:var(--navy);color:#fff;font-weight:600;min-height:46px}
button.s{background:#fff;color:var(--navy);border:1px solid var(--navy)}button.d{background:var(--red)}button.sm{padding:6px 10px;min-height:34px;font-size:14px}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.btns>*{flex:1;min-width:120px}
.row{display:flex;justify-content:space-between;gap:10px;align-items:center;background:var(--card);border-radius:10px;padding:13px;margin-bottom:8px;border-left:5px solid var(--blue)}
.row small{display:block;color:#678;margin-top:2px}.row span{font-weight:700;text-align:right;white-space:nowrap}
.card{background:var(--card);border-radius:10px;padding:13px;margin-bottom:10px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid .card b{display:block;font-size:26px;color:var(--navy)}
.warn{background:#fff3cd;border:1px solid #ffc107;border-radius:10px;padding:12px;margin-bottom:10px;font-size:14px}
.low{border-left-color:var(--red)}
#nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:#fff;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:5}
#nav button{flex:1;background:none;color:#678;padding:7px 0;font-size:10px;border-radius:0;font-weight:500}
#nav button b{display:block;font-size:20px}#nav button.on{color:var(--navy);font-weight:700}
.fab{position:fixed;left:14px;right:14px;bottom:calc(66px + env(safe-area-inset-bottom));z-index:4;box-shadow:0 3px 12px #0003}
.mr{background:#f7f9fb;border:1px solid var(--line);border-radius:10px;padding:8px;margin-bottom:8px}
.mr .g{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.mr small{font-size:11px;color:#678}
#tot{background:#d4edda;border:2px solid var(--ok);border-radius:10px;padding:12px;margin-top:14px;line-height:1.7}
#sheetwrap{display:none}.pv #app{display:none}.pv #sheetwrap{display:block}
#tb{position:sticky;top:0;background:#fff;padding:8px;display:flex;gap:6px;flex-wrap:wrap;z-index:9;border-bottom:1px solid var(--line)}#tb button{flex:1;padding:8px;font-size:13px;min-height:38px}
#sheet{transform-origin:top left}
/* ---- Πρότυπο προσφοράς (από το υπάρχον HTML) ---- */
@page{size:A4 portrait;margin:8mm}
.container{width:210mm;margin:0 auto;background:#fff;padding:8mm;font-family:Arial,sans-serif;color:#000;box-shadow:0 2px 10px #0001}
.container *{line-height:normal}
.header{background:#2c3e50;color:#fff;padding:10px;margin:-8mm -8mm 4mm -8mm;position:relative;min-height:62px}
.header-content{text-align:center}
.contact-info{position:absolute;top:10px;left:10px;text-align:left;font-size:7.5px;line-height:1.4;opacity:.95}
.offer-details-header{position:absolute;top:10px;right:10px;text-align:right;font-size:7.5px;line-height:1.4;opacity:.95}
.contact-info div,.offer-details-header div{margin-bottom:1px}
.header h1{font-size:16px;margin-bottom:2px;font-weight:600}.header p{font-size:10px;opacity:.9}
.section-title{color:#2c3e50;font-size:10px;font-weight:700;margin:3mm 0 2mm;padding-bottom:2px;border-bottom:2px solid #2c3e50;text-transform:uppercase}
.project-objective{background:#ecf0f1;padding:8px;margin:3mm 0;border-left:4px solid #3498db;font-size:9px;line-height:1.5!important;color:#2c3e50;white-space:pre-line}
.project-objective strong{display:block;margin-bottom:4px;font-size:9.5px}
.work-description{background:#f9f9f9;border:1px solid #ddd;padding:8px;margin-bottom:3mm;font-size:8.5px;line-height:1.5}
.work-description h3{color:#2c3e50;font-size:9.5px;margin:0 0 4px;font-weight:600}
.work-description ul,.clarifications ul{margin-left:16px;margin-top:3px}.work-description li{margin-bottom:3px;color:#555}
.clarifications{background:#fff3cd;border:1px solid #ffc107;border-left:4px solid #ffc107;padding:8px;margin:3mm 0;font-size:8.5px}
.clarifications h3{color:#856404;font-size:9.5px;margin:0 0 4px;font-weight:700}.clarifications li{margin-bottom:2px;color:#856404}
.separator{border:0;border-top:2px dashed #bbb;margin:3mm 0}
.price-box{background:#d4edda;border:2px solid #28a745;padding:8px;margin:3mm 0;border-radius:4px;color:#155724}
.price-box h3{font-size:9.5px;margin:0 0 4px;font-weight:700;color:#155724}
.price-box table{width:100%;border-collapse:collapse;font-size:8.5px;margin:4px 0}.price-box td,.price-box th{padding:2px 3px;text-align:right;border-bottom:1px solid #9fd3ab}.price-box td:first-child,.price-box th:first-child{text-align:left}
.pl{display:flex;justify-content:space-between;font-size:9.5px;margin-bottom:3px}
.pt{display:flex;justify-content:space-between;font-size:16px;font-weight:700;border-top:2px solid #28a745;margin-top:6px;padding-top:6px}
.note{font-size:8px;margin-top:3px}
.vat-notice{text-align:center;margin:3mm 0;font-weight:700;font-size:10px;color:#c53030;background:#fff5f5;padding:6px;border:2px solid #c53030;border-radius:4px}
.footer{text-align:center;margin-top:3mm;padding-top:3mm;color:#777;font-size:8px;border-top:1px solid #ddd}
@media print{
 html,body{background:#fff!important;width:210mm;-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important}
 #app,#tb{display:none!important}#sheetwrap{display:block!important}
 #sheet{zoom:1!important;transform:none!important}.container{box-shadow:none;margin:0;width:210mm}
}
</style>
</head>
<body>
<div id="app"><main id="m"></main><nav id="nav"></nav></div>
<div id="sheetwrap"><div id="tb"></div><div id="sheet"></div></div>
<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const num=v=>{const n=parseFloat(String(v??'').replace(',','.'));return isNaN(n)?0:n};
const eur=c=>(c/100).toLocaleString('el-GR',{style:'currency',currency:'EUR'});
const dt=d=>new Date(d).toLocaleDateString('el-GR',{day:'2-digit',month:'2-digit',year:'numeric'});
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const lines=t=>String(t||'').split('\n').map(s=>s.trim()).filter(Boolean);
const rnd=Math.round;
/* ---------- IndexedDB ---------- */
const STORES=['clients','projects','quotes','materials','moves','kv'];
let _db;const db=()=>_db||(_db=new Promise((ok,no)=>{const r=indexedDB.open('epc-app',1);r.onupgradeneeded=()=>STORES.forEach(s=>r.result.createObjectStore(s,{keyPath:'id'}));r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)}));
const run=async(s,m,...a)=>{const d=await db();return new Promise((ok,no)=>{const r=d.transaction(s,'readwrite').objectStore(s)[m](...a);r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)})};
const put=(s,o)=>run(s,'put',o),del=(s,i)=>run(s,'delete',i),all=s=>run(s,'getAll'),get=(s,i)=>run(s,'get',i);
/* ---------- Ρυθμίσεις ---------- */
const DEF={id:'set',phone:'6979723128',email:'chr.panagiotis33@gmail.com',web:'www.energypc.gr',nextNo:2163,validDays:30,vat:24,markup:25,lastBackup:null,
clar:'Χωνευτή εγκατάσταση: Όλες οι καλωδιώσεις θα βρίσκονται εντός σωλήνων, χωνευτές και όχι εξωτερικές\nΣτην τιμή συμπεριλαμβάνονται: Τα υλικά και η εργασία για την εγκατάσταση\nΔεν συμπεριλαμβάνεται: Η αγορά των πριζών, των διακοπτών και των ηλεκτρικών συσκευών\nΔιευκρίνιση Εργασιών: Η παρούσα προσφορά αφορά αποκλειστικά την ηλεκτρολογική εγκατάσταση. Οποιαδήποτε οικοδομική εργασία αποκατάστασης επιφανειών (επιχρίσματα/σοβάδες) δεν εμπίπτει στο πεδίο αρμοδιότητάς μας και δεν περιλαμβάνεται στην τελική κοστολόγηση'};
let SET=DEF;
const saveSet=()=>put('kv',SET);
/* ---------- Υπολογισμοί (ακέραια λεπτά, στρογγυλοποίηση ανά γραμμή στο λεπτό) ---------- */
function calc(q){
 const m=(q.mats||[]).map(x=>{const cost=rnd(num(x.q)*num(x.cost)*100);return{...x,cost,sale:rnd(cost*(1+num(x.mk)/100))}});
 const l=(q.labor||[]).map(x=>({...x,cost:rnd(num(x.q)*num(x.cost)*100),sale:rnd(num(x.q)*num(x.rate)*100)}));
 const e=(q.extra||[]).map(x=>({...x,cost:rnd(num(x.amt)*100),sale:rnd(num(x.amt)*100)}));
 const S=a=>a.reduce((t,x)=>t+x.sale,0),C=a=>a.reduce((t,x)=>t+x.cost,0);
 const net=S(m)+S(l)+S(e),vat=rnd(net*num(q.vat)/100);
 return{m,l,e,matSale:S(m),labSale:S(l),extSale:S(e),matCost:C(m),labCost:C(l),extCost:C(e),net,vat,total:net+vat,profit:net-C(m)-C(l)-C(e)};
}
/* ---------- Βοηθητικά UI ---------- */
const ST_P={new:'Νέο',pending:'Προσφορά σε εκκρεμότητα',approved:'Εγκεκριμένο',inprogress:'Σε εξέλιξη',done:'Ολοκληρωμένο',cancelled:'Ακυρωμένο'};
const ST_Q={draft:'Πρόχειρη',pending:'Εκκρεμεί',approved:'Εγκρίθηκε',rejected:'Απορρίφθηκε'};
const UNITS=['τεμ','μ','μ καλωδίου','ρολό','κουτί','κιλό','λίτρο'];
const opts=o=>Object.entries(o);
const row=(click,t,sub,right,s,cls='')=>`<div class="row ${cls}" data-s="${esc((s||'').toLowerCase())}" onclick="${click}"><div><b>${esc(t)}</b><small>${esc(sub)}</small></div><span>${right||''}</span></div>`;
const flt=v=>$$('#list .row').forEach(r=>r.hidden=!r.dataset.s.includes(v.toLowerCase()));
const search=()=>`<input placeholder="🔍 Αναζήτηση" oninput="flt(this.value)" style="margin-bottom:10px">`;
const F=(fs,o={})=>fs.map(([k,l,t,op])=>`<label>${l}</label>`+(t=='area'?`<textarea name="${k}" rows="3">${esc(o[k])}</textarea>`:t=='sel'?`<select name="${k}">${op.map(([v,n])=>`<option value="${esc(v)}"${o[k]==v?' selected':''}>${esc(n)}</option>`).join('')}</select>`:`<input name="${k}" ${t=='n'?'inputmode="decimal"':''} value="${esc(o[k])}">`)).join('');
const C=()=>Object.fromEntries($$('#f [name]').map(e=>[e.name,e.value.trim()]));
const by=k=>(a,b)=>String(a[k]).localeCompare(String(b[k]),'el');
async function save(store,id,back,req){
 const o={...((id&&await get(store,id))||{id:uid()}),...C()};
 if(!o[req])return alert('Συμπλήρωσε το πεδίο που είναι απαραίτητο.');
 await put(store,o);go(back)}
async function remove(store,id,back,msg){if(confirm(msg||'Διαγραφή;')){await del(store,id);go(back)}}
/* ---------- Πλοήγηση ---------- */
let V='home',P=null,Q=null,STK={};
const NAV=[['home','🏠','Αρχική'],['clients','👤','Πελάτες'],['projects','🛠','Έργα'],['quotes','📄','Προσφορές'],['stock','📦','Αποθήκη'],['settings','⚙️','Ρυθμίσεις']];
const go=(v,p)=>{V=v;P=p;scrollTo(0,0);render()};
async function render(){
 document.body.classList.remove('pv');
 const tab=({buy:'stock',imp:'stock',dict:'quotes',dictR:'quotes'})[V]||V;
 $('#nav').innerHTML=NAV.map(([k,i,l])=>`<button class="${tab.slice(0,4)==k.slice(0,4)?'on':''}" onclick="go('${k}')"><b>${i}</b>${l}</button>`).join('');
 $('#m').innerHTML=await VIEWS[V](P)}
const VIEWS={
async home(){
 const [pr,qs,ms]=await Promise.all([all('projects'),all('quotes'),all('materials')]);
 const low=ms.filter(m=>num(m.min)>0&&num(m.qty)<=num(m.min));
 const act=pr.filter(p=>['approved','inprogress'].includes(p.status)).length;
 const pend=qs.filter(q=>q.status=='pending').length;
 const prof=qs.filter(q=>q.status=='approved').reduce((t,q)=>t+calc(q).profit,0);
 const old=!SET.lastBackup||Date.now()-SET.lastBackup>7*864e5;
 return `<h2>Αρχική</h2>${old?`<div class="warn">⚠️ Δεν υπάρχει πρόσφατο αντίγραφο ασφαλείας. Αν χαθεί το κινητό ή σβηστούν τα δεδομένα του browser, χάνονται όλα. <a href="#" onclick="go('settings');return false">Δημιούργησε αντίγραφο</a></div>`:''}
 <div class="grid"><div class="card"><b>${act}</b>Ενεργά έργα</div><div class="card"><b>${pend}</b>Προσφορές σε εκκρεμότητα</div><div class="card" onclick="go('stock')"><b>${low.length}</b>Χαμηλά αποθέματα</div><div class="card"><b>${eur(prof)}</b>Εκτιμώμενο κέρδος εγκεκριμένων</div></div>
 <div class="btns"><button onclick="D=null;go('dict')" style="flex-basis:100%">🎤 Νέα προσφορά με υπαγόρευση</button><button class="s" onclick="newQ()">+ Χειροκίνητη προσφορά</button><button class="s" onclick="go('clientC','')">+ Νέος πελάτης</button></div>`},
async clients(){const l=(await all('clients')).sort(by('name'));
 return `<h2>Πελάτες</h2>${search()}<div id="list">${l.map(c=>row(`go('clientC','${c.id}')`,c.name,c.phone||c.address||'','',c.name+(c.phone||'')+(c.address||''))).join('')||'<p>Δεν υπάρχουν πελάτες ακόμα. Πάτα «Νέος πελάτης».</p>'}</div><button class="fab" onclick="go('clientC','')">+ Νέος πελάτης</button>`},
async clientC(id){const c=(id&&await get('clients',id))||{};
 const pr=(await all('projects')).filter(p=>p.clientId==id),qs=(await all('quotes')).filter(q=>q.clientId==id);
 return `<h2>${c.name?esc(c.name):'Νέος πελάτης'}</h2><div id="f">${F([['name','Όνομα *'],['phone','Τηλέφωνο'],['email','Email'],['address','Διεύθυνση'],['notes','Σημειώσεις','area']],c)}</div>
 <div class="btns"><button onclick="save('clients','${id}','clients','name')">Αποθήκευση</button><button class="s" onclick="go('clients')">Πίσω</button>${id?`<button class="d" onclick="remove('clients','${id}','clients','Διαγραφή πελάτη; Οι αποθηκευμένες προσφορές διατηρούνται.')">Διαγραφή</button>`:''}</div>
 ${id?`<h3>Έργα</h3>${pr.map(p=>row(`go('projectC','${p.id}')`,p.title,ST_P[p.status],'')).join('')||'<small>Κανένα</small>'}<h3>Προσφορές</h3>${qs.map(q=>row(`go('quoteV','${q.id}')`,'№ '+q.no+' – '+q.title,dt(q.date)+' · '+ST_Q[q.status],eur(calc(q).net))).join('')||'<small>Καμία</small>'}<div class="btns"><button onclick="newQ('${id}')">+ Νέα προσφορά</button></div>`:''}`},
async projects(){const [l,cl]=await Promise.all([all('projects'),all('clients')]);const cn=Object.fromEntries(cl.map(c=>[c.id,c.name]));
 return `<h2>Έργα</h2>${search()}<div id="list">${l.sort(by('title')).map(p=>row(`go('projectC','${p.id}')`,p.title,(cn[p.clientId]||'—')+' · '+ST_P[p.status],'',p.title+(cn[p.clientId]||'')+(p.area||''))).join('')||'<p>Τα έργα δημιουργούνται και μέσα από τις προσφορές, ή πάτα «Νέο έργο».</p>'}</div><button class="fab" onclick="go('projectC','')">+ Νέο έργο</button>`},
async projectC(id){const p=(id&&await get('projects',id))||{status:'new'};const cl=(await all('clients')).sort(by('name'));
 const qs=(await all('quotes')).filter(q=>q.projectId==id);
 return `<h2>${p.title?esc(p.title):'Νέο έργο'}</h2><div id="f">${F([['clientId','Πελάτης','sel',[['','—'],...cl.map(c=>[c.id,c.name])]],['title','Τίτλος έργου *'],['area','Περιοχή'],['address','Διεύθυνση έργου'],['status','Κατάσταση','sel',opts(ST_P)],['desc','Περιγραφή εργασιών','area']],p)}</div>
 <div class="btns"><button onclick="save('projects','${id}','projects','title')">Αποθήκευση</button><button class="s" onclick="go('projects')">Πίσω</button>${id?`<button class="d" onclick="remove('projects','${id}','projects')">Διαγραφή</button>`:''}</div>
 ${id?`<h3>Προσφορές έργου</h3>${qs.map(q=>row(`go('quoteV','${q.id}')`,'№ '+q.no,dt(q.date)+' · '+ST_Q[q.status],eur(calc(q).net))).join('')||'<small>Καμία</small>'}${p.clientId?`<div class="btns"><button onclick="newQ('${p.clientId}','${id}')">+ Νέα προσφορά</button></div>`:''}${costBox(qs)}`:''}`},
async quotes(){const l=(await all('quotes')).sort((a,b)=>b.no-a.no);
 return `<h2>Προσφορές</h2>${search()}<div id="list">${l.map(q=>row(`go('quoteV','${q.id}')`,'№ '+q.no+' – '+q.title,(q.cl?.name||'—')+' · '+dt(q.date)+' · '+ST_Q[q.status]+(q.version>1?' · έκδ.'+q.version:''),eur(calc(q).net),q.no+q.title+(q.cl?.name||''))).join('')||'<p>Καμία προσφορά ακόμα.</p>'}</div><button class="fab" onclick="newQ()">+ Νέα προσφορά</button>`},
async quoteEd(){STK=Object.fromEntries((await all('materials')).map(m=>[m.id,m]));return edHTML()},
async quoteV(id){const q=await get('quotes',id);document.body.classList.add('pv');
 $('#sheet').innerHTML=sheet(q);fit();
 $('#tb').innerHTML=`<button class="s" onclick="go('quotes')">‹ Πίσω</button><button onclick="print()">🖨 Εκτύπωση / PDF</button><button class="s" onclick="toggleMode('${id}')">${q.mode=='full'?'Δείξε συνοπτική':'Δείξε αναλυτική'}</button><button class="s" onclick="editQ('${id}')">✏️ Επεξεργασία</button><select onchange="setQS('${id}',this.value)" style="flex:1;padding:6px">${opts(ST_Q).map(([k,v])=>`<option value="${k}"${q.status==k?' selected':''}>${v}</option>`).join('')}</select><button class="s" onclick="useStock('${id}')">📦 Αφαίρεση υλικών</button>`;return ''},
async stock(){const l=(await all('materials')).sort(by('d'));
 return `<h2>Αποθήκη</h2><div class="btns" style="margin:0 0 10px"><button class="s" onclick="go('buy')">🛒 Υλικά προς αγορά</button><button class="s" onclick="go('imp')">📥 Εισαγωγή τιμών</button></div>${search()}<div id="list">${l.map(m=>{const lo=num(m.min)>0&&num(m.qty)<=num(m.min);return row(`go('stockC','${m.id}')`,m.d,[m.code,m.cat,m.supplier,eur(rnd(num(m.price)*100))+'/'+m.unit].filter(Boolean).join(' · '),num(m.qty)+' '+esc(m.unit),[m.code,m.d,m.cat,m.supplier].join(' '),lo?'low':'')}).join('')||'<p>Η αποθήκη είναι άδεια. Πρόσθεσε το πρώτο υλικό.</p>'}</div><button class="fab" onclick="go('stockC','')">+ Νέο υλικό</button>`},
async stockC(id){const m=(id&&await get('materials',id))||{unit:'τεμ',qty:'0'};const mv=(await all('moves')).filter(x=>x.mid==id).sort((a,b)=>b.date-a.date).slice(0,15);
 return `<h2>${m.d?esc(m.d):'Νέο υλικό'}</h2><div id="f">${F([['code','Κωδικός'],['d','Περιγραφή *'],['cat','Κατηγορία'],['unit','Μονάδα','sel',UNITS.map(u=>[u,u])],['qty','Διαθέσιμη ποσότητα','n'],['min','Ελάχιστο απόθεμα','n'],['price','Τιμή αγοράς χωρίς ΦΠΑ (€)','n'],['supplier','Προμηθευτής'],['src','Σύνδεσμος πηγής τιμής (προαιρετικό)']],m)}</div>${m.priceDate?`<small>Τιμή ενημερώθηκε: ${dt(m.priceDate)}</small>`:''}

async function saveMat(id){const o=C(),old=id&&await get('materials',id)||{};if(!o.d)return alert('Συμπλήρωσε περιγραφή.');
 const m={...old,id:id||uid(),...o,hist:old.hist||[]};
 if(!old.id||num(old.price)!=num(m.price)){m.priceDate=Date.now();m.hist.push({t:m.priceDate,p:num(m.price)})}
 const d=num(m.qty)-num(old.qty||0);
 await put('materials',m);if(d)await put('moves',{id:uid(),mid:m.id,date:Date.now(),delta:d,note:old.id?'Χειροκίνητη διόρθωση':'Αρχικό απόθεμα'});go('stock')}
async function useStock(id){const q=await get('quotes',id);
 if(q.deducted)return alert('Τα υλικά αυτής της προσφοράς έχουν ήδη αφαιρεθεί από την αποθήκη.');
 const L=q.mats.filter(x=>x.mid&&num(x.q)>0);if(!L.length)return alert('Δεν υπάρχουν υλικά από την αποθήκη σε αυτή την προσφορά.');
 if(!confirm('Επιβεβαιώνεις ότι τα υλικά χρησιμοποιήθηκαν πραγματικά; Θα αφαιρεθούν από την αποθήκη (μία φορά).'))return;
 for(const x of L){const m=await get('materials',x.mid);if(!m)continue;m.qty=num(m.qty)-num(x.q);await put('materials',m);await put('moves',{id:uid(),mid:m.id,date:Date.now(),delta:-num(x.q),note:'Χρήση – προσφορά № '+q.no})}
 q.deducted=true;await put('quotes',q);alert('Η αποθήκη ενημερώθηκε.')}

const UN=new Set(['m','μ','μετρα','μετρο','μετρων','μετ']),STOP=new Set(['το','τα','του','των','στο','με','για','και','ειναι','μου','να','θελω']);
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
const isN=s=>/^\d+(\.\d+)?$/.test(s),isSp=s=>/^\d+(\.\d+)?x\d+(\.\d+)?$/.test(s);
function parseItems(text){
 const out=[];let cur=null,pc=null;
 const flush=()=>{if(!cur)return;const c=cur;cur=null;
  const cable=c.spec||c.specN||c.alt||c.words.some(w=>norm(w).startsWith('καλωδ'));
  if(cable){const spec=c.spec||(c.specN?c.specN+'x?':null)||(c.alt&&pc?pc.spec:null);
   const it={d:'Καλώδιο'+(spec?' '+spec.replace('.',','):''),q:c.len||c.q||'1',u:'μ',cable:true,spec};pc=it;out.push(it)}
  else if(c.words.length)out.push({d:cap(c.words.join(' ')),q:c.q||'1',u:'τεμ'})};
 const nu=()=>({words:[],q:null,len:null,spec:null,specN:null,alt:false});
 text.split(/,(?!\d)|[;\n]+|\s+και\s+|\s+μετά\s+|\.\s+/i).forEach(ch=>{
  flush();cur=nu();
  const T=ch.trim().split(/\s+/).filter(Boolean).map(r=>{let n=norm(r).replace(/[^\p{L}\p{N}.×]/gu,'');n=NW[n]??n;if(n=='επι'||n=='×')n='x';return{r,n}}).filter(t=>t.n);
  for(let i=1;i<T.length-1;i++)if(T[i].n=='x'&&isN(T[i-1].n)&&isN(T[i+1].n)){T.splice(i-1,3,{r:'',n:T[i-1].n+'x'+T[i+1].n});i--}
  for(let i=0;i<T.length;i++){const n=T[i].n,nu_=i+1<T.length&&UN.has(T[i+1].n),g=n.match(/^(\d+(?:\.\d+)?)(m|μ)$/);
   if(n=='αλλο'){flush();cur=nu();cur.alt=true}
   else if(g)cur.len=g[1];
   else if(isSp(n)){const[a,b]=n.split('x');if(nu_){cur.specN=a;cur.len=b;i++}else cur.spec=n}
   else if(isN(n)){if(nu_){cur.len=n;i++}else{if(cur.words.length||cur.alt){flush();cur=nu()}cur.q=n}}
   else if(!STOP.has(n)&&!UN.has(n))cur.words.push(T[i].r)}
 });flush();return out}
const stems=s=>norm(s).split(/[^\p{L}\p{N}.x]+/u).filter(w=>w.length>1).map(w=>w.slice(0,5));
function matchMat(it,ms){let best=null,bs=0;const a=stems(it.d);if(!a.length)return null;
 for(const m of ms){if(it.cable&&it.spec&&!norm(m.d).includes(it.spec))continue;const b=stems(m.d),s=a.filter(w=>b.includes(w)).length/a.length;if(s>bs){bs=s;best=m}}
 return bs>=.6?best:null}

async dictR(){const cl=(await all('clients')).sort(by('name'));

 <h3>Εργασία</h3><div class="grid"><div><label>Μεροκάματό σου €</label><input inputmode="decimal" value="${esc(D.lab.me)}" oninput="D.lab.me=this.value"></div><div><label>Ημέρες σου</label><input inputmode="decimal" value="${esc(D.lab.dme)}" oninput="D.lab.dme=this.value"></div><div><label>Μεροκάματο βοηθού €</label><input inputmode="decimal" value="${esc(D.lab.h)}" oninput="D.lab.h=this.value"></div><div><label>Ημέρες βοηθού</label><input inputmode="decimal" value="${esc(D.lab.dh)}" oninput="D.lab.dh=this.value"></div></div><small>Τα μεροκάματα θυμούνται για την επόμενη φορά. Το μεροκάματο βοηθού μετράει και ως κόστος σου.</small>
 <label>Πελάτης *</label><select onchange="D.lab.cl=this.value"><option value="">—</option>${cl.map(c=>`<option value="${c.id}"${D.lab.cl==c.id?' selected':''}>${esc(c.name)}</option>`).join('')}</select>
 <div class="btns"><button onclick="dictOK()">Δημιουργία προσφοράς</button><button class="s" onclick="go('dict')">‹ Πίσω</button></div>`},
async imp(){return `<h2>Εισαγωγή τιμών προμηθευτή</h2><div class="card" style="font-size:14px">Μία γραμμή ανά υλικό: <b>περιγραφή ; τιμή ; μονάδα ; κωδικός</b> (μονάδα και κωδικός προαιρετικά, η τιμή χωρίς ΦΠΑ). Στείλε μου την προσφορά του προμηθευτή στη συνομιλία με το Claude και θα σου τη γυρίσω έτοιμη να την κολλήσεις εδώ.</div><label>Προμηθευτής</label><input id="isup"><label>Γραμμές</label><textarea id="itx" rows="9"></textarea><div class="btns"><button onclick="impPrev()">Έλεγχος</button><button class="s" onclick="go('stock')">Πίσω</button></div><div id="ipv"></div>`}});
async function analyze(){const t=$('#dt').value.trim();if(!t)return alert('Υπαγόρευσε ή γράψε πρώτα το έργο.');
 const m=t.match(/υλικ[άα]\s*(μου\s*)?(είναι|:)?/i),i=m?m.index:-1;
 const title=(i>0?t.slice(0,i):'').replace(/[\s,.:]+$/,'').replace(/\s+τα$/i,'').trim();
 const items=parseItems(i>=0?t.slice(i+m[0].length):t);
 if(!items.length)return alert('Δεν κατάλαβα υλικά. Δοκίμασε π.χ.: «Τα υλικά είναι ένας πίνακας, πέντε πρίζες».');
 const ms=await all('materials');
 items.forEach(x=>{const k=matchMat(x,ms);if(k){x.mid=k.id;x.price=String(num(k.price));x.u=k.unit||x.u;x.d=k.d}else x.price=''});
 D={text:t,title:cap(title),items,lab:{me:SET.rateMe||'',h:SET.rateH||'',dme:'1',dh:'0',cl:''}};go('dictR')}
async function dictOK(){const L=D.lab;
 if(!L.cl)return alert('Διάλεξε πελάτη.');
 if(D.items.some(x=>!x.mid&&String(x.price).trim()===''))return alert('Γράψε την τιμή αγοράς στις κόκκινες γραμμές.');
 for(const x of D.items)if(!x.mid){const m={id:uid(),d:x.d,unit:x.u||'τεμ',qty:'0',min:'',price:String(num(x.price)),cat:'',code:'',supplier:'',priceDate:Date.now(),hist:[{t:Date.now(),p:num(x.price)}]};await put('materials',m);x.mid=m.id}
 SET.rateMe=L.me;SET.rateH=L.h;await saveSet();
 await newQ(L.cl);Q.title=D.title;Q.objective=D.title;Q.sections=[{t:'Εργασίες',items:D.title}];
 Q.mats=D.items.map(x=>({mid:x.mid,d:x.d,q:x.q,u:x.u,cost:String(num(x.price)),mk:SET.markup}));
 if(num(L.dme)>0)Q.labor.push({d:'Ηλεκτρολόγος – ημέρες',q:L.dme,cost:'0',rate:L.me});
 if(num(L.dh)>0)Q.labor.push({d:'Βοηθός – ημέρες',q:L.dh,cost:L.h,rate:L.h});
 go('quoteEd')}
async function impPrev(){const ms=await all('materials'),sup=$('#isup').value.trim();IMP=[];
 $('#itx').value.split('\n').forEach(l=>{const p=l.split(/;|\t/).map(s=>s.trim());if(!p[0]||!(num(p[1])>0))return;
  const code=p[3]||'',ex=ms.find(m=>(code&&m.code==code)||norm(m.d)==norm(p[0]));IMP.push({d:p[0],price:num(p[1]),u:p[2]||(ex?.unit)||'τεμ',code,sup,ex})});
 $('#ipv').innerHTML=IMP.length?`<h3>${IMP.length} γραμμές</h3>${IMP.map(x=>row('',x.d,x.ex?(num(x.ex.price)==x.price?'Ίδια τιμή':'Αλλαγή τιμής: '+num(x.ex.price)+' → '+x.price):'Νέο υλικό',eur(rnd(x.price*100)))).join('')}<div class="btns"><button onclick="impDo()">Εισαγωγή όλων</button></div>`:'<p>Δεν βρήκα έγκυρες γραμμές (χρειάζεται περιγραφή ; τιμή).</p>'}
async function impDo(){for(const x of IMP){const t=Date.now();let m=x.ex;
  if(m){if(num(m.price)!=x.price){m.hist=(m.hist||[]).concat({t,p:x.price});m.priceDate=t}m.price=String(x.price);if(x.sup)m.supplier=x.sup}
  else m={id:uid(),d:x.d,unit:x.u,qty:'0',min:'',price:String(x.price),cat:'',code:x.code,supplier:x.sup,priceDate:t,hist:[{t,p:x.price}]};
  await put('materials',m)}alert('Οι τιμές καταχωρίστηκαν.');go('stock')}
