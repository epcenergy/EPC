<title>EPC Ηλεκτρολόγος</title>
<style>
:root{--ink:#1d2b38;--navy:#2c3e50;--blue:#3498db;--bg:#eef1f4;--card:#fff;--line:#d5dbe1;--red:#c53030;--ok:#28a745}
*{box-sizing:border-box;margin:0;padding:0}
body{font:16px/1.4 -apple-system,Arial,sans-serif;background:var(--bg);color:var(--ink)}
#m{padding:14px 14px calc(150px + env(safe-area-inset-bottom))}
h2{font-size:22px;margin:6px 0 12px;color:var(--navy)}h3{font-size:16px;margin:16px 0 6px;color:var(--navy)}
label{display:block;font-size:13px;font-weight:600;margin:10px 0 3px;color:#456}
input,select,textarea{width:100%;padding:12px;border:1px solid var(--line);border-radius:8px;font:inherit;background:#fff}
textarea{resize:vertical}
button{font:inherit;border:0;border-radius:10px;padding:13px 16px;background:var(--navy);color:#fff;font-weight:600;min-height:46px}
button.s{background:#fff;color:var(--navy);border:1px solid var(--navy)}button.d{background:var(--red)}button.sm{padding:6px 10px;min-height:34px;font-size:14px}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.btns>*{flex:1;min-width:120px}
.row{display:flex;justify-content:space-between;gap:10px;align-items:center;background:var(--card);border-radius:10px;padding:13px;margin-bottom:8px;border-left:5px solid var(--blue)}
.row small{display:block;color:#678;margin-top:2px}.row span{font-weight:700;text-align:right;white-space:nowrap}
.card{background:var(--card);border-radius:10px;padding:13px;margin-bottom:10px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid .card b{display:block;font-size:26px;color:var(--navy)}
.warn{background:#fff3cd;border:1px solid #ffc107;border-radius:10px;padding:12px;margin-bottom:10px;font-size:14px}
.low{border-left-color:var(--red)}
#nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:#fff;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:5}
#nav button{flex:1;background:none;color:#678;padding:7px 0;font-size:10px;border-radius:0;font-weight:500}
#nav button b{display:block;font-size:20px}#nav button.on{color:var(--navy);font-weight:700}
.fab{position:fixed;left:14px;right:14px;bottom:calc(66px + env(safe-area-inset-bottom));z-index:4;box-shadow:0 3px 12px #0003}
.qbody{padding:2px 4px 10px}.crow.ok{border-color:#2a9d5c;background:#f0faf4}.crow input{margin:0}.mr{background:#f7f9fb;border:1px solid var(--line);border-radius:10px;padding:8px;margin-bottom:8px}
.mr .g{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.mr small{font-size:11px;color:#678}
#tot{background:#d4edda;border:2px solid var(--ok);border-radius:10px;padding:12px;margin-top:14px;line-height:1.7}
#sheetwrap{display:none}.pv #app{display:none}.pv #sheetwrap{display:block}
#tb{position:sticky;top:0;background:#fff;padding:8px;display:flex;gap:6px;flex-wrap:wrap;z-index:9;border-bottom:1px solid var(--line)}#tb button{flex:1;padding:8px;font-size:13px;min-height:38px}
#sheet{transform-origin:top left}
.okb{background:#d4edda;border-radius:8px;padding:8px;font-size:13px;margin:6px 0}.warnb{background:#fff3cd;border-radius:8px;padding:8px;font-size:13px;margin:6px 0}.redb{background:#fdecea;border:1px solid #c53030;border-radius:8px;padding:8px;font-size:13px;margin:6px 0}.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}.mr.unk{border-color:#c53030}
[hidden]{display:none!important}
.grp{margin:0 0 10px}.grp>summary{cursor:pointer;padding:12px 14px;background:var(--c,#fff);border-radius:12px;font-size:16px;list-style:none;box-shadow:0 1px 2px rgba(0,0,0,.08);margin-bottom:6px}.grp>summary::-webkit-details-marker{display:none}.grp>summary::before{content:'▸ ';}.grp[open]>summary::before{content:'▾ ';}.grp.sub{margin:0 0 6px 14px}.grp.sub>summary{font-size:15px;background:#f6f8fa}.lowb{color:#c0392b;font-weight:600;font-size:13px}
.sw{position:relative;overflow:hidden;border-radius:10px;margin-bottom:8px}.sw .row{margin:0}
.swbg{position:absolute;left:0;top:0;bottom:0;width:90px;background:#c53030;color:#fff;display:flex;align-items:center;justify-content:center;font-size:26px}
.swfg{position:relative;touch-action:pan-y;transition:transform .2s;user-select:none;-webkit-user-select:none}
/* ---- Πρότυπο προσφοράς (από το υπάρχον HTML) ---- */
@page{size:A4 portrait;margin:8mm}
.container{width:210mm;margin:0 auto;background:#fff;padding:8mm;font-family:Arial,sans-serif;color:#000;box-shadow:0 2px 10px #0001}
.container *{line-height:normal}
.header{background:#2c3e50;color:#fff;padding:10px;margin:-8mm -8mm 4mm -8mm;position:relative;min-height:62px}
.header-content{text-align:center}
.contact-info{position:absolute;top:10px;left:10px;text-align:left;font-size:7.5px;line-height:1.4;opacity:.95}
.offer-details-header{position:absolute;top:10px;right:10px;text-align:right;font-size:7.5px;line-height:1.4;opacity:.95}
.contact-info div,.offer-details-header div{margin-bottom:1px}
.header h1{font-size:16px;margin-bottom:2px;font-weight:600}.header p{font-size:10px;opacity:.9}
.section-title{color:#2c3e50;font-size:10px;font-weight:700;margin:3mm 0 2mm;padding-bottom:2px;border-bottom:2px solid #2c3e50;text-transform:uppercase}
.project-objective{background:#ecf0f1;padding:8px;margin:3mm 0;border-left:4px solid #3498db;font-size:9px;line-height:1.5!important;color:#2c3e50;white-space:pre-line}
.project-objective strong{display:block;margin-bottom:4px;font-size:9.5px}
.work-description{background:#f9f9f9;border:1px solid #ddd;padding:8px;margin-bottom:3mm;font-size:8.5px;line-height:1.5}
.work-description h3{color:#2c3e50;font-size:9.5px;margin:0 0 4px;font-weight:600}
.work-description ul,.clarifications ul{margin-left:16px;margin-top:3px}.work-description li{margin-bottom:3px;color:#555}
.clarifications{background:#fff3cd;border:1px solid #ffc107;border-left:4px solid #ffc107;padding:8px;margin:3mm 0;font-size:8.5px}
.clarifications h3{color:#856404;font-size:9.5px;margin:0 0 4px;font-weight:700}.clarifications li{margin-bottom:2px;color:#856404}
.separator{border:0;border-top:2px dashed #bbb;margin:3mm 0}
.price-box{background:#d4edda;border:2px solid #28a745;padding:8px;margin:3mm 0;border-radius:4px;color:#155724}
.price-box h3{font-size:9.5px;margin:0 0 4px;font-weight:700;color:#155724}
.price-box table{width:100%;border-collapse:collapse;font-size:8.5px;margin:4px 0}.price-box td,.price-box th{padding:2px 3px;text-align:right;border-bottom:1px solid #9fd3ab}.price-box td:first-child,.price-box th:first-child{text-align:left}
.pl{display:flex;justify-content:space-between;font-size:9.5px;margin-bottom:3px}
.pt{display:flex;justify-content:space-between;font-size:16px;font-weight:700;border-top:2px solid #28a745;margin-top:6px;padding-top:6px}
.note{font-size:8px;margin-top:3px}
.vat-notice{text-align:center;margin:3mm 0;font-weight:700;font-size:10px;color:#c53030;background:#fff5f5;padding:6px;border:2px solid #c53030;border-radius:4px}
.footer{text-align:center;margin-top:3mm;padding-top:3mm;color:#777;font-size:8px;border-top:1px solid #ddd}
@media print{
 html,body{background:#fff!important;width:210mm;-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important}
 #app,#tb{display:none!important}#sheetwrap{display:block!important}
 #sheet{zoom:1!important;transform:none!important}.container{box-shadow:none;margin:0;width:210mm}
}
</style>

<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const num=v=>{const n=parseFloat(String(v??'').replace(',','.'));return isNaN(n)?0:n};
const eur=c=>(c/100).toLocaleString('el-GR',{style:'currency',currency:'EUR'});
const dt=d=>new Date(d).toLocaleDateString('el-GR',{day:'2-digit',month:'2-digit',year:'numeric'});
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const lines=t=>String(t||'').split('\n').map(s=>s.trim()).filter(Boolean);
const rnd=Math.round;
/* ---------- IndexedDB ---------- */
const STORES=['clients','projects','quotes','materials','moves','kv','orders'],DROP=['clients','projects','quotes'];
async function purge(){for(const k of DROP)for(const o of await all(k))await del(k,o.id)}
let _db;const db=()=>_db||(_db=new Promise((ok,no)=>{const r=indexedDB.open('epc-app',2);r.onupgradeneeded=()=>STORES.forEach(s=>{if(!r.result.objectStoreNames.contains(s))r.result.createObjectStore(s,{keyPath:'id'})});r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)}));
const run=async(s,m,...a)=>{const d=await db();return new Promise((ok,no)=>{const r=d.transaction(s,'readwrite').objectStore(s)[m](...a);r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)})};
const put=(s,o)=>run(s,'put',o),del=(s,i)=>run(s,'delete',i),all=s=>run(s,'getAll'),get=(s,i)=>run(s,'get',i);
/* ---------- Ρυθμίσεις ---------- */
const DEF={id:'set',phone:'6979723128',email:'chr.panagiotis33@gmail.com',web:'www.energypc.gr',nextNo:2163,validDays:30,vat:24,markup:25,lastBackup:null,
clar:'Χωνευτή εγκατάσταση: Όλες οι καλωδιώσεις θα βρίσκονται εντός σωλήνων, χωνευτές και όχι εξωτερικές\nΣτην τιμή συμπεριλαμβάνονται: Τα υλικά και η εργασία για την εγκατάσταση\nΔεν συμπεριλαμβάνεται: Η αγορά των πριζών, των διακοπτών και των ηλεκτρικών συσκευών\nΔιευκρίνιση Εργασιών: Η παρούσα προσφορά αφορά αποκλειστικά την ηλεκτρολογική εγκατάσταση. Οποιαδήποτε οικοδομική εργασία αποκατάστασης επιφανειών (επιχρίσματα/σοβάδες) δεν εμπίπτει στο πεδίο αρμοδιότητάς μας και δεν περιλαμβάνεται στην τελική κοστολόγηση'};
let SET=DEF;
const saveSet=()=>put('kv',SET);
/* ---------- Υπολογισμοί (ακέραια λεπτά, στρογγυλοποίηση ανά γραμμή στο λεπτό) ---------- */
function calc(q){
 const m=(q.mats||[]).map(x=>{const cost=rnd(num(x.q)*num(x.cost)*100);return{...x,cost,sale:rnd(cost*(1+num(x.mk)/100))}});
 const l=(q.labor||[]).map(x=>({...x,cost:rnd(num(x.q)*num(x.cost)*100),sale:rnd(num(x.q)*num(x.rate)*100)}));
 const e=(q.extra||[]).map(x=>({...x,cost:rnd(num(x.amt)*100),sale:rnd(num(x.amt)*100)}));
 const S=a=>a.reduce((t,x)=>t+x.sale,0),C=a=>a.reduce((t,x)=>t+x.cost,0);
 const net=S(m)+S(l)+S(e),vat=rnd(net*num(q.vat)/100);
 return{m,l,e,matSale:S(m),labSale:S(l),extSale:S(e),matCost:C(m),labCost:C(l),extCost:C(e),net,vat,total:net+vat,profit:net-C(m)-C(l)-C(e)};
}

async function save(store,id,back,req){
 const o={...((id&&await get(store,id))||{id:uid()}),...C()};
 if(!o[req])return alert('Συμπλήρωσε το πεδίο που είναι απαραίτητο.');
 await put(store,o);go(back)}
async function remove(store,id,back,msg){if(confirm(msg||'Διαγραφή;')){await del(store,id);go(back)}}

async function saveSettings(){SET={...SET,...C()};SET.backupDays=num(SET.backupDays)||7;await saveSet();alert('Αποθηκεύτηκε.');render()}
async function saveMat(id){const o=C(),old=id&&await get('materials',id)||{};if(!o.d)return alert('Συμπλήρωσε περιγραφή.');
 const m={...old,id:id||uid(),...o,hist:old.hist||[]};
 if(!old.id||num(old.price)!=num(m.price)){m.priceDate=Date.now();m.hist.push({t:m.priceDate,p:num(m.price)})}
 const d=num(m.qty)-num(old.qty||0);
 await put('materials',m);if(d)await put('moves',{id:uid(),mid:m.id,date:Date.now(),delta:d,note:old.id?'Χειροκίνητη διόρθωση':'Αρχικό απόθεμα'});go('stock')}
async function exportDB(){const d={app:'epc-app',v:1,date:Date.now()};for(const s of STORES)if(!DROP.includes(s))d[s]=await all(s);
 SET.lastBackup=Date.now();await saveSet();
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(d)],{type:'application/json'}));a.download='epc-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(render,500)}
async function importDB(f){if(!f)return;let d;try{d=JSON.parse(await f.text());if(d.app!='epc-app')throw 0}catch{return alert('Το αρχείο δεν είναι έγκυρο αντίγραφο.')}
 if(!confirm('Η επαναφορά ΑΝΤΙΚΑΘΙΣΤΑ όλα τα τρέχοντα δεδομένα. Συνέχεια;'))return;
 for(const s of STORES){for(const o of await all(s))await del(s,o.id);if(!DROP.includes(s))for(const o of d[s]||[])await put(s,o)}
 SET={...DEF,...((d.kv||[]).find(k=>k.id=='set')||{})};await saveSet();alert('Η επαναφορά ολοκληρώθηκε.');go('home')}

function parseItems(text){
 const out=[];let cur=null,pc=null;
 const flush=()=>{if(!cur)return;const c=cur;cur=null;
  const cable=c.spec||c.specN||c.alt||c.words.some(w=>norm(w).startsWith('καλωδ'));
  if(cable){const spec=c.spec||(c.specN?c.specN+'x?':null)||(c.alt&&pc?pc.spec:null);
   const it={d:'Καλώδιο'+(spec?' '+spec.replace('.',','):''),q:c.len||c.q||'1',u:'μ',cable:true,spec};pc=it;out.push(it)}
  else if(c.words.length)out.push({d:cap(c.words.join(' ')),q:c.q||'1',u:'τεμ'})};
 const nu=()=>({words:[],q:null,len:null,spec:null,specN:null,alt:false});
 text.split(/,(?!\d)|[;\n]+|\s+και\s+|\s+μετά\s+|\.\s+/i).forEach(ch=>{
  flush();cur=nu();
  const T=ch.trim().split(/\s+/).filter(Boolean).map(r=>{let n=norm(r).replace(/[^\p{L}\p{N}.×]/gu,'').replace(/\.+$/,'');n=NW[n]??n;if(n=='επι'||n=='×')n='x';return{r,n}}).filter(t=>t.n);
  for(let i=1;i<T.length-1;i++)if(T[i].n=='x'&&isN(T[i-1].n)&&isN(T[i+1].n)){T.splice(i-1,3,{r:'',n:T[i-1].n+'x'+T[i+1].n});i--}
  for(let i=0;i<T.length;i++){const n=T[i].n,nu_=i+1<T.length&&UN.has(T[i+1].n),g=n.match(/^(\d+(?:\.\d+)?)(m|μ)$/);
   if(n=='αλλο'){flush();cur=nu();cur.alt=true}
   else if(g)cur.len=g[1];
   else if(isSp(n)){const[a,b]=n.split('x');if(nu_){cur.specN=a;cur.len=b;i++}else cur.spec=n}
   else if(isN(n)){if(nu_){cur.len=n;i++}else{if(cur.words.length||cur.alt){flush();cur=nu()}cur.q=n}}
   else if(!STOP.has(n)&&!UN.has(n))cur.words.push(T[i].r)}

function kw(t){const n=norm(t);if(n.length!=t.length)return null;

const isMeter=u=>['μ','μ καλωδίου'].includes(u);
const sfold=s=>fold(String(s||'').replace(/×/g,'x')).replace(/(\d)\s*x\s*(\d)/g,'$1x$2');
const toks=s=>sfold(s).split(/[^\p{L}\p{N}.]+/u).map(t=>t.replace(/^\.+|\.+$/g,'')).filter(Boolean);

const hasNum=(h,t)=>{let i=-1;while((i=h.indexOf(t,i+1))>=0){const l=h[i-1],r=h[i+t.length],r2=h[i+t.length+1];if((!l||!/[0-9.]/.test(l))&&(!r||!/[0-9]/.test(r))&&!(r=='.'&&/[0-9]/.test(r2||'')))return true}return false};
const lev1=(a,b)=>{if(a==b)return true;if(Math.abs(a.length-b.length)>1)return false;let i=0;while(i<a.length&&i<b.length&&a[i]==b[i])i++;if(a.length==b.length)return a.slice(i+1)==b.slice(i+1);return a.length>b.length?a.slice(i+1)==b.slice(i):b.slice(i+1)==a.slice(i)};
const cpre=(a,b)=>{let k=0;while(k<a.length&&k<b.length&&a[k]==b[k])k++;return k};
const mIx=m=>({m,code:toks(m.code),d:toks(m.d),kw:toks(m.kw),sub:toks((m.sub||'')+' '+(m.cat||'')),sup:toks(m.supplier),num:sfold([m.code,m.d,m.kw].join(' '))});
const FW=[['code',1],['d',1],['kw',1],['sub',.6],['sup',.3]];
/* δύναμη ταιριάσματος μιας λέξης αναζήτησης με ένα υλικό (0..1). Διατομές/αμπέρ = ΑΚΡΙΒΩΣ */
function wTok(q,ix){
 if(STRICT(q))return hasNum(ix.num,q)?1:0;
 let best=0;const hasD=/\d/.test(q);
 for(const [f,w] of FW)for(const t of ix[f]){let s=0;
  if(t==q)s=1;else if(q.length>=2&&t.startsWith(q))s=.9;
  else if(q.length>=3&&f=='code'&&t.includes(q))s=.8;
  else if(q.length>=4&&t.length>=4&&!hasD&&!/\d/.test(t)){const k=cpre(q,t);if(k>=4&&k>=Math.min(q.length,t.length)-2)s=.75}

function searchScore(qs,ix){let tot=0;for(const q of qs){const s=wTok(q,ix);if(!s)return 0;tot+=s}return tot/qs.length}
const STOPT=new Set(['τεμ','τεμαχια','τεμαχιο','μετρα','μετρο','για','με','και','το','τα','του','των','ενα','μια']);
function rankMats(it,MIX){
 const q=toks(it.d).filter(t=>!STOPT.has(t));if(!q.length)return{best:null,conf:'none',cands:[]};

 for(const ix of MIX){
  if(q.some(t=>ix.code.includes(t)&&t.length>=2&&/\d|[a-z]/.test(t)&&ix.code.length)){R.push({m:ix.m,score:1,cov:1,avg:1,exact:true});continue}
  const st=q.map(t=>wTok(t,ix));
  if(q.some((t,i)=>STRICT(t)&&!st[i]))continue;
  const cov=st.filter(Boolean).length/q.length;if(cov<.5)continue;
  const avg=st.reduce((a,b)=>a+b,0)/q.length;
  const md=ix.d.filter(t=>!STRICT(t));const covM=md.length?md.filter(t=>q.some(w=>w==t||t.startsWith(w)||(w.length>=4&&t.length>=4&&cpre(w,t)>=Math.max(4,Math.min(w.length,t.length)-2)))).length/md.length:1;
  R.push({m:ix.m,score:.7*avg+.3*covM,cov,avg,exact:false})}

 const sure=b&&(b.exact?!(s2&&s2.exact):(b.cov==1&&b.avg>=.7&&(!s2||b.score-s2.score>=.15)));
 return{best:b?b.m:null,conf:sure?'sure':R.length?'maybe':'none',cands:R.filter(r=>r.score>=.4).slice(0,3).map(r=>r.m.id)}}

async function refreshApp(){try{(await navigator.serviceWorker?.getRegistrations?.()||[]).forEach(r=>r.unregister());(await caches.keys()).forEach(k=>caches.delete(k))}catch{}alert('Θα φορτωθεί η τελευταία έκδοση. Τα δεδομένα σου δεν επηρεάζονται.');location.reload()}
/* ---------- Κατηγορίες υλικών ---------- */
const DEFCATS=['Καλώδια και αγωγοί','Σωλήνες και κανάλια','Κουτιά και στηρίξεις','Διακόπτες και πρίζες','Πίνακες και προστασίες','Φωτισμός','Αισθητήρες και αυτοματισμοί','Εργαλεία και αναλώσιμα','Λοιπά'];
let SUBC={};
async function loadCats(){const k=await get('kv','cats');return Array.isArray(k?.v)?k.v:DEFCATS.slice()}
const saveCats=a=>put('kv',{id:'cats',v:a});
document.addEventListener('change',async e=>{const t=e.target;if(t.name=='cat'&&t.value=='__new'){const n=(prompt('Όνομα νέας κατηγορίας:')||'').trim();
 if(!n){t.value='';return}const c=await loadCats();if(!c.includes(n)){c.push(n);await saveCats(c)}
 if(![...t.options].some(o=>o.value==n)){t.insertBefore(new Option(n,n),t.querySelector('[value="__new"]'))}t.value=n}});
VIEWS.cats=async()=>{const SB=await loadSubs(),c=await loadCats(),ms=await all('materials'),cnt=k=>ms.filter(m=>(m.cat||'').trim()==k).length,extra=[...new Set(ms.map(m=>(m.cat||'').trim()).filter(x=>x&&!c.includes(x)))];
 return `<h2>🗂 Κατηγορίες υλικών</h2><div class="card" style="font-size:14px">Εδώ φτιάχνεις τη λίστα με τις κατηγορίες της αποθήκης. Σε κάθε υλικό διαλέγεις μία. Η μετονομασία αλλάζει όλα τα υλικά της κατηγορίας. Κάθε κατηγορία έχει υποκατηγορίες (π.χ. μάρκες). Αν σβήσεις μια κατηγορία, τα υλικά της δεν χάνονται· πάνε στο «Χωρίς κατηγορία».</div>
 ${c.map((k,i)=>`<div class="row"><div><b>${esc(k)}</b><small>${cnt(k)} υλικά</small></div><span><button class="s sm" onclick="catMove(${i},-1)">▲</button> <button class="s sm" onclick="catMove(${i},1)">▼</button> <button class="s sm" onclick="catRen(${i})">✏️</button> <button class="d sm" onclick="catDel(${i})">🗑</button></span></div>${(SB[k]||[]).map((x,j)=>`<div class="row" style="margin-left:22px"><div>↳ ${esc(x)}<small>${ms.filter(m=>(m.cat||'').trim()==k&&(m.sub||'').trim()==x).length} υλικά</small></div><span><button class="s sm" onclick="subMove(${i},${j},-1)">▲</button> <button class="s sm" onclick="subMove(${i},${j},1)">▼</button> <button class="s sm" onclick="subRen(${i},${j})">✏️</button> <button class="d sm" onclick="subDel(${i},${j})">🗑</button></span></div>`).join('')}<div style="margin:0 0 10px 22px"><button class="s sm" onclick="subAdd(${i})">➕ Υποκατηγορία (μάρκα) στην «${esc(k)}»</button></div>`).join('')}
 ${extra.length?`<h3>Κατηγορίες που χρησιμοποιούν υλικά αλλά δεν είναι στη λίστα</h3>${extra.map(k=>`<div class="row"><div><b>${esc(k)}</b><small>${cnt(k)} υλικά</small></div><span><button class="s sm" onclick="catAddX(this.dataset.k)" data-k="${esc(k)}">➕ Στη λίστα</button></span></div>`).join('')}`:''}
 <label>Νέα κατηγορία</label><input id="cnew" placeholder="π.χ. Ασφάλειες"><div class="btns"><button onclick="catAdd()">Προσθήκη</button><button class="s" onclick="go('stock')">Πίσω</button></div>`};
async function catAdd(){const n=($('#cnew').value||'').trim();if(!n)return;const c=await loadCats();if(c.includes(n))return alert('Υπάρχει ήδη.');c.push(n);await saveCats(c);go('cats')}
async function catAddX(k){const c=await loadCats();if(!c.includes(k))c.push(k);await saveCats(c);go('cats')}
async function catMove(i,d){const c=await loadCats(),j=i+d;if(j<0||j>=c.length)return;[c[i],c[j]]=[c[j],c[i]];await saveCats(c);go('cats')}
async function catRen(i){const c=await loadCats(),o=c[i],n=(prompt('Νέο όνομα κατηγορίας:',o)||'').trim();if(!n||n==o)return;if(c.includes(n))return alert('Υπάρχει ήδη κατηγορία με αυτό το όνομα.');
 c[i]=n;await saveCats(c);{const S=await loadSubs();if(S[o]){S[n]=S[o];delete S[o];await saveSubs(S)}}for(const m of await all('materials'))if((m.cat||'').trim()==o){m.cat=n;await put('materials',m)}
 if(STO.has(o)){STO.delete(o);STO.add(n);stoSave()}go('cats')}
async function catDel(i){const c=await loadCats(),o=c[i],ms=(await all('materials')).filter(m=>(m.cat||'').trim()==o);
 if(!confirm('Να σβηστεί η κατηγορία «'+o+'»;'+(ms.length?'\nΤα '+ms.length+' υλικά της δεν σβήνονται· θα μπουν στο «Χωρίς κατηγορία».':'')))return;
 c.splice(i,1);await saveCats(c);{const S=await loadSubs();delete S[o];await saveSubs(S)}for(const m of ms){m.cat='';m.sub='';await put('materials',m)}go('cats')}
/* ---------- Υποκατηγορίες (π.χ. μάρκες) ---------- */
async function loadSubs(){const k=await get('kv','subs');return k&&k.v&&typeof k.v=='object'?k.v:{}}
const saveSubs=o=>put('kv',{id:'subs',v:o});
const subOpts=(list,cur)=>[['','— Χωρίς υποκατηγορία —'],...list.map(x=>[x,x]),...(cur&&!list.includes(cur)?[[cur,cur]]:[]),['__newsub','➕ Νέα υποκατηγορία…']];
function subHTML(cat,ms,list){const by={};ms.forEach(m=>{const k=(m.sub||'').trim();(by[k]=by[k]||[]).push(m)});
 const names=[...list,...Object.keys(by).filter(k=>k&&!list.includes(k)).sort((a,b)=>a.localeCompare(b,'el'))];
 const none=by['']||[];
 return names.map(n=>{const a=by[n]||[],key=cat+'›'+n,low=a.filter(isLow).length;
  return `<details class="grp sub" data-g="${esc(key)}" ${STO.has(key)?'open':''} ontoggle="togG(this)"><summary><b>${esc(n)}</b> <small>(${a.length})</small>${low?` <span class="lowb">⚠️ ${low}</span>`:''}</summary>${a.map(mrow).join('')}</details>`}).join('')+none.map(mrow).join('')}
/* αλλαγή κατηγορίας στη φόρμα υλικού → ανανέωση λίστας υποκατηγοριών */
document.addEventListener('change',async e=>{const t=e.target;if(t.name=='cat'&&t.value!='__new'){const sb=$('#f [name=sub]');if(!sb)return;const S=await loadSubs(),l=S[t.value]||[];
  sb.innerHTML=subOpts(l,'').map(([v,n])=>`<option value="${esc(v)}">${esc(n)}</option>`).join('')}
 if(t.name=='sub'&&t.value=='__newsub'){const cat=$('#f [name=cat]')?.value||'';if(!cat||cat=='__new'){alert('Διάλεξε πρώτα κατηγορία.');t.value='';return}
  const n=(prompt('Όνομα νέας υποκατηγορίας (π.χ. μάρκα):')||'').trim();if(!n){t.value='';return}
  const S=await loadSubs();S[cat]=S[cat]||[];if(!S[cat].includes(n)){S[cat].push(n);await saveSubs(S)}
  if(![...t.options].some(o=>o.value==n))t.insertBefore(new Option(n,n),t.querySelector('[value="__newsub"]'));t.value=n}});
async function subAdd(i){const c=await loadCats(),cat=c[i],n=(prompt('Νέα υποκατηγορία στην «'+cat+'» (π.χ. μάρκα):')||'').trim();if(!n)return;
 const S=await loadSubs();S[cat]=S[cat]||[];if(S[cat].includes(n))return alert('Υπάρχει ήδη.');S[cat].push(n);await saveSubs(S);go('cats')}
async function subRen(i,j){const c=await loadCats(),cat=c[i],S=await loadSubs(),o=(S[cat]||[])[j],n=(prompt('Νέο όνομα υποκατηγορίας:',o)||'').trim();if(!n||n==o)return;
 if(S[cat].includes(n))return alert('Υπάρχει ήδη.');S[cat][j]=n;await saveSubs(S);for(const m of await all('materials'))if((m.cat||'').trim()==cat&&(m.sub||'').trim()==o){m.sub=n;await put('materials',m)}
 const a=cat+'›'+o;if(STO.has(a)){STO.delete(a);STO.add(cat+'›'+n);stoSave()}go('cats')}
async function subDel(i,j){const c=await loadCats(),cat=c[i],S=await loadSubs(),o=(S[cat]||[])[j],ms=(await all('materials')).filter(m=>(m.cat||'').trim()==cat&&(m.sub||'').trim()==o);
 if(!confirm('Να σβηστεί η υποκατηγορία «'+o+'»;'+(ms.length?'\nΤα '+ms.length+' υλικά της μένουν στην κατηγορία «'+cat+'» χωρίς υποκατηγορία.':'')))return;
 S[cat].splice(j,1);await saveSubs(S);for(const m of ms){m.sub='';await put('materials',m)}go('cats')}
async function subMove(i,j,d){const c=await loadCats(),cat=c[i],S=await loadSubs(),l=S[cat]||[],k=j+d;if(k<0||k>=l.length)return;[l[j],l[k]]=[l[k],l[j]];await saveSubs(S);go('cats')}
/* ---------- Εκκίνηση ---------- */
(async()=>{
 await purge();SET={...DEF,...((await get('kv','set'))||{})};
 window._cl={};const orig=VIEWS.quoteEd;VIEWS.quoteEd=async()=>{window._cl=Object.fromEntries((await all('clients')).sort(by('name')).map(c=>[c.id,c]));return orig()};
 navigator.storage?.persist?.();
 if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
 await render();
 try{const od=!SET.lastBackup||Date.now()-SET.lastBackup>(num(SET.backupDays)||7)*864e5,td=new Date().toISOString().slice(0,10);
  if(od&&localStorage.getItem('bkAsk')!=td){localStorage.setItem('bkAsk',td);
   setTimeout(()=>{if(confirm('🔔 Υπενθύμιση: '+(SET.lastBackup?'το τελευταίο αντίγραφο ασφαλείας ήταν στις '+dt(SET.lastBackup)+'.':'δεν έχεις κάνει ακόμα αντίγραφο ασφαλείας.')+'\nΝα ανοίξω τις Ρυθμίσεις για να το κάνεις τώρα;'))go('settings')},600)}}catch{}
})();
</script>
